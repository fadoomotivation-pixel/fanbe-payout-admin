name: Build Android APK

# Produces an installable APK for the collection app.
#
# Runs on demand, on a version tag, and on pushes that touch the app — so a caller can
# always be handed a build that matches what is live, without anyone needing Android
# Studio on their machine.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also build a signed release APK (needs the signing secrets)'
        type: boolean
        default: false
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `cache: npm` and no `npm ci`, on purpose: this repo gitignores
      # package-lock.json, so there is no lock file on the runner for either of them to
      # use — which is exactly what failed the first run. Caching the npm download folder
      # keyed on package.json gets most of the speed back without needing one.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The APK ships the built web assets, so Supabase must be baked in at build time.
      # Falls back to the values compiled into src/lib/supabase.ts when the secrets are
      # not set, which is what keeps this workflow green on a fresh fork.
      # Catches the two traps that have each shipped a broken build: a lucide icon
      # shadowing a global constructor, and two files sharing a name so an extensionless
      # import silently picks the wrong one. The second white-screened the first APK.
      - name: Check for module and global traps
        run: npm run check:globals

      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # A bundle without Supabase config installs fine and then shows nothing but a white
      # screen, which is exactly how the first APK failed. Catch it here, not on a phone.
      - name: Verify the bundle carries Supabase config
        run: |
          if ! grep -rqE 'https://[a-z0-9]+\.supabase\.co' dist/assets/*.js; then
            echo "::error::The built bundle has no Supabase URL. The app would install and show a white screen."
            exit 1
          fi
          echo "Supabase config is present in the bundle."

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the debug APK
        id: debug
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT="fanbe-collections-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fanbe-collections-debug-apk
          path: ${{ steps.debug.outputs.path }}
          retention-days: 30

      # ── Signed release build ────────────────────────────────────────
      # Only when the signing secrets exist.  Android refuses to install two APKs with the
      # same package id signed by different keys, so once you ship a signed build to the
      # team, keep using the same keystore or every phone needs a reinstall.
      - name: Decode keystore
        id: keystore
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — skipping the signed build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.ready == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload signed release APK
        if: steps.keystore.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fanbe-collections-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.debug.outputs.path }}
            android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: false
